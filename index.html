}
function finishSession() {
  const total = state.pool.length || 0;
  const alreadySaved = state.finishedSaved === true;
  if(!alreadySaved && total) { state.history.push({date:new Date().toLocaleString('fr-CH'), score:state.score, total}); state.finishedSaved=true; save(); }
  const pct = total ? Math.round(state.score / total * 100) : 0;
  return `<section class="card"><h2>Session terminée 🎉</h2><p>Score : <b>${state.score}/${total}</b> (${pct}%)</p><p class="muted">Objectif officiel : 10 bonnes réponses sur 16. Ici, on vise surtout les automatismes.</p><div class="grid"><button class="bigbtn" data-action="startQuiz" data-kind="essential">Refaire l’essentiel</button><button class="bigbtn secondary" data-action="startQuiz" data-kind="errors">Revoir mes erreurs</button></div></section>`;
}
function home() { const last=state.history.length?state.history[state.history.length-1]:null; return `<section class="card"><h2>Mission commando pour demain soir</h2><p>On révise vite, clair, fiable. Cette version corrige le compteur du quiz : il avance vraiment question par question.</p><div class="grid"><button class="bigbtn" data-tabgo="survie">🚨 Survie examen<br><span class="tiny">Questions essentielles seulement</span></button><button class="bigbtn secondary" data-tabgo="quiz">✅ Quiz complet<br><span class="tiny">${QUESTIONS.length} questions</span></button><button class="bigbtn secondary" data-tabgo="flash">🃏 Flashcards<br><span class="tiny">Réponse mentale puis vérification</span></button><button class="bigbtn warn" data-tabgo="errors">🎯 Revoir les erreurs<br><span class="tiny">Ce qui tombe mal revient</span></button></div></section><section class="card"><h2>Mini-plan 24h</h2><div class="statrow"><b>1. Maintenant</b><span>Survie examen</span></div><div class="statrow"><b>2. Ce soir</b><span>Flashcards essentielles</span></div><div class="statrow"><b>3. Demain</b><span>Erreurs + politique/social</span></div>${last?`<p class="muted">Dernier score : ${last.score}/${last.total}</p>`:''}</section>`; }
function quizStart(kind,title) { const count=filterIndexes(kind).length; return `<section class="card"><h2>${title}</h2><p class="muted">${count} questions. Une seule bonne réponse. Le compteur et la barre de progression sont gérés par une session interne stable.</p><button class="bigbtn" data-action="startQuiz" data-kind="${kind}">Démarrer ${count} questions</button></section>`; }
function quizView() {
  if(!state.pool.length) return quizStart('all','Quiz complet');
  if(state.idx >= state.pool.length) return finishSession();
  const e=currentEntry(); const q=QUESTIONS[e.qIndex];
  const currentNumber = state.idx + 1;
  const pct = Math.max(1, Math.round((state.idx / state.pool.length) * 100));
  const answerBlock = state.answered ? `<div class="answer ${state.selectedChoice===q.correct?'good':'bad'}">${state.selectedChoice===q.correct?'✅':'❌'} Réponse : <b>${escapeHtml(q.a)}</b></div><button class="bigbtn" data-action="next">Question suivante</button>` : '';
  return `<section class="card"><h2>Quiz complet</h2><div class="muted">Question ${currentNumber} / ${state.pool.length} · Score ${state.score}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="meta"><span class="pill">${escapeHtml(q.scope)}</span><span class="pill">${escapeHtml(q.theme)}</span><span class="pill">${escapeHtml(q.level)}</span></div><h2>${escapeHtml(q.q)}</h2>${e.displayChoices.map(c=>choiceButton(c,q)).join('')}${answerBlock}</section>`;
}
function choiceButton(c,q) {
  let cls='choice';
  if(state.answered) { if(c.originalIndex===q.correct) cls+=' correct'; else if(c.originalIndex===state.selectedChoice) cls+=' wrong'; }
  return `<button class="${cls}" data-action="answer" data-original="${c.originalIndex}" ${state.answered?'disabled':''}>${escapeHtml(c.text)}</button>`;
}
function flashStart(kind,title) { const count=filterIndexes(kind).length; return `<section class="card"><h2>${title}</h2><p class="muted">${count} cartes. Idéal avant de dormir : lire la question, répondre à voix haute, puis retourner.</p><button class="bigbtn" data-action="startFlash" data-kind="${kind}">Démarrer ${count} flashcards</button></section>`; }
function flashView() {
  if(!state.pool.length) return flashStart('all','Flashcards');
  if(state.idx>=state.pool.length) return `<section class="card"><h2>Flashcards terminées ✅</h2><p>Respire. Tu as fait le tour.</p><button class="bigbtn" data-action="startFlash" data-kind="essential">Refaire l’essentiel</button></section>`;
  const q=QUESTIONS[state.pool[state.idx]]; const showingA=state.flashSide==='a'; const pct=Math.max(1,Math.round((state.idx/state.pool.length)*100));
  return `<section class="card"><h2>Flashcards</h2><div class="muted">Carte ${state.idx+1} / ${state.pool.length}</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="meta"><span class="pill">${escapeHtml(q.scope)}</span><span class="pill">${escapeHtml(q.theme)}</span></div><div class="flash ${showingA?'answerSide':''}">${escapeHtml(showingA?q.a:q.q)}</div><div class="grid" style="margin-top:12px"><button class="bigbtn secondary" data-action="flip">${showingA?'Voir question':'Voir réponse'}</button><button class="bigbtn" data-action="nextFlash">Carte suivante</button></div></section>`;
}
function errorsView() { if(!state.errors.length) return `<section class="card"><h2>Erreurs</h2><p>Aucune erreur enregistrée pour l’instant.</p><button class="bigbtn" data-action="startQuiz" data-kind="essential">Faire un quiz essentiel</button></section>`; return `<section class="card"><h2>Erreurs à revoir</h2><p class="muted">${state.errors.length} question(s) dans la liste.</p><div class="grid"><button class="bigbtn" data-action="startQuiz" data-kind="errors">Quiz erreurs</button><button class="bigbtn secondary" data-action="clearErrors">Vider les erreurs</button></div></section>`; }
function statsView() { const byTheme={}; QUESTIONS.forEach(q=>byTheme[q.theme]=(byTheme[q.theme]||0)+1); return `<section class="card"><h2>Progression</h2><p><b>${QUESTIONS.length}</b> questions dans cette version · ${QUESTIONS.filter(q=>q.level==='Essentiel').length} essentielles.</p>${Object.entries(byTheme).map(([k,v])=>`<div class="statrow"><b>${escapeHtml(k)}</b><span>${v} questions</span></div>`).join('')}<h2 style="margin-top:18px">Historique</h2>${state.history.length?state.history.slice(-8).reverse().map(h=>`<div class="statrow"><span>${escapeHtml(h.date)}</span><b>${h.score}/${h.total}</b></div>`).join(''):'<p class="muted">Pas encore de session terminée.</p>'}</section>`; }
function render() {
  document.getElementById('mainAction').textContent = state.tab==='quiz'?'Démarrer quiz':state.tab==='flash'?'Démarrer cartes':state.tab==='survie'?'Démarrer survie':'Démarrer';
  if(state.mode==='quiz') screen.innerHTML=quizView();
  else if(state.mode==='flash') screen.innerHTML=flashView();
  else if(state.tab==='home') screen.innerHTML=home();
  else if(state.tab==='survie') screen.innerHTML=quizStart('essential','Survie examen');
  else if(state.tab==='quiz') screen.innerHTML=quizStart('all','Quiz complet');
  else if(state.tab==='flash') screen.innerHTML=flashStart('all','Flashcards');
  else if(state.tab==='errors') screen.innerHTML=errorsView();
  else if(state.tab==='stats') screen.innerHTML=statsView();
}
document.addEventListener('click', ev => {
  const tabBtn = ev.target.closest('[data-tab]'); if(tabBtn) return setTab(tabBtn.dataset.tab);
  const tabGo = ev.target.closest('[data-tabgo]'); if(tabGo) return setTab(tabGo.dataset.tabgo);
  const btn = ev.target.closest('[data-action]'); if(!btn) return;
  const action = btn.dataset.action;
  if(action==='home') return setTab('home');
  if(action==='main') { if(state.tab==='quiz') return startQuiz('all'); if(state.tab==='survie') return startQuiz('essential'); if(state.tab==='flash') return startFlash('all'); return setTab('survie'); }
  if(action==='startQuiz') return startQuiz(btn.dataset.kind || 'all');
  if(action==='startFlash') return startFlash(btn.dataset.kind || 'all');
  if(action==='answer') return answerChoice(Number(btn.dataset.original));
  if(action==='next') return nextQuestion();
  if(action==='flip') { state.flashSide = state.flashSide==='q' ? 'a' : 'q'; return render(); }
  if(action==='nextFlash') { state.idx += 1; state.flashSide='q'; return render(); }
  if(action==='clearErrors') { state.errors=[]; save(); return render(); }
});
render();
</script>
</body>
</html>
